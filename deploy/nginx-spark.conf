# /etc/nginx/sites-enabled/spark-leadsallyearlong
# spark.leadsallyearlong.space: Node server (deploy/arabic-trading-spark.service) on 127.0.0.1:3093.
# The server does the country redirects, the page rate limit and lead submission;
# nginx only serves the hashed build assets itself.
# Deploy: git pull && npm ci && npm run build && systemctl restart arabic-trading-spark
server {
    server_name spark.leadsallyearlong.space;

    # Only Cloudflare may connect, so CF-Connecting-IP / CF-IPCountry can be trusted.
    include /etc/nginx/snippets/cloudflare-only.conf;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;

    location ~ /\.(?!well-known) { return 404; }

    # Hashed build assets: served from disk, cached long
    location /assets/ {
        root /var/www/arabic-trading-spark/arabic-trading-spark/.output/public;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /api/submit-lead {
        limit_except POST { deny all; }
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:3093;
        include /var/www/arabic-trading-spark/arabic-trading-spark/deploy/nginx-proxy-headers.conf;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3093;
        include /var/www/arabic-trading-spark/arabic-trading-spark/deploy/nginx-proxy-headers.conf;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/spark.leadsallyearlong.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/spark.leadsallyearlong.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = spark.leadsallyearlong.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name spark.leadsallyearlong.space;
    return 404; # managed by Certbot
}
